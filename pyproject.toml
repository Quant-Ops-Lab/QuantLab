[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-research"
version = "0.7.0"
description = "Research-first market intelligence and gated strategy experiments"
requires-python = ">=3.11"
dependencies = [
	"exchange-calendars>=4.5,<5",
	"numpy>=1.26",
	"pandas>=2.2",
	"scikit-learn>=1.4",
	"scipy>=1.12",
	"torch>=2.2",
	"transformers>=4.45",
	"xgboost>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
console = ["streamlit>=1.50", "plotly>=5.20"]
stream = ["websockets>=12"]
aws = ["boto3>=1.34"]
api = ["fastapi>=0.116", "uvicorn>=0.35"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
quantlab-demo = "quantlab.demo:main"
quantlabctl = "quantlab.control.cli:main"
quantlab-quotes = "quantlab.services.market_monitor:main"
quantlab-edgar = "quantlab.intelligence.sec_monitor:main"
quantlab-crypto = "quantlab.services.crypto_daemon:main"
quantlab-equities = "quantlab.services.equity_daemon:main"
quantlab-live = "quantlab.services.daemon:main"
quantlab-notify = "quantlab.services.alert_dispatcher:main"
quantlab-research = "quantlab.services.research_daemon:main"
quantlab-research-backfill = "quantlab.research.backfill:main"
quantlab-stress = "quantlab.research.stress_cli:main"
quantlab-opportunity = "quantlab.research.opportunity_cli:main"
quantlab-eod = "quantlab.market.massive_eod:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
